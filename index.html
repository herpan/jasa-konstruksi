<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUMI MITRA KENCANA</title>
    <style>
        /* Reset semua margin & padding, hilangkan scrollbar ganda */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #111827; /* Warna gelap senada dengan hero image */
        }
        /* Buat iframe benar-benar full screen */
        iframe { 
            width: 100vw; 
            height: 100vh; 
            border: none; 
            display: block; 
        }
    </style>
</head>
<body>
    <iframe src="https://script.google.com/macros/s/AKfycbxDep76rsONVSQyZgvmTnGO3f0necpQMjt6ATq1AGez1yiRXOHg9CatYU9YjuLtWO0G/exec"></iframe>
</body>
</html>
